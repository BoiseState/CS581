<text x="56" y="518" font-family="monospace" font-size="10" fill="#ff6b5e" opacity="0.45">SIGIL: PROCEDURAL · NOT A LIKENESS · NO PERSON DEPICTED</text>

<line x1="42" y1="558" x2="708" y2="558" stroke="#ff6b5e" stroke-width="1" opacity="0.4"/>
<text x="42" y="590" font-family="monospace" font-size="11" fill="#7a8fa6" letter-spacing="1.2">SIGNATURE TTP</text>
<text x="42" y="616" font-family="Georgia,serif" font-size="19" fill="#f2f6fa">Unauthorized Command Message via native industrial</text>
<text x="42" y="640" font-family="Georgia,serif" font-size="19" fill="#f2f6fa">protocols</text>
<rect x="42" y="654" width="61" height="26" rx="4" fill="#e8453c" opacity="0.2"/>
<text x="53" y="672" font-family="monospace" font-size="13" font-weight="bold" fill="#ff6b5e">T0855</text>

<text x="42" y="718" font-family="monospace" font-size="11" fill="#7a8fa6" letter-spacing="1.2">SECTOR TARGETING</text>
<text x="42" y="740" font-family="Georgia,serif" font-size="15" fill="#dce8f4">Electric · Liquefied natural gas · Targeted by</text>
<text x="42" y="761" font-family="Georgia,serif" font-size="15" fill="#dce8f4">protocol, not by sector</text>
<text x="430" y="718" font-family="monospace" font-size="11" fill="#7a8fa6" letter-spacing="1.2">FIRST OBSERVED</text>
<text x="430" y="740" font-family="Georgia,serif" font-size="15" fill="#dce8f4">2022, before any observed use</text>

<line x1="42" y1="800" x2="708" y2="800" stroke="#ff6b5e" stroke-width="1" opacity="0.4"/>
<text x="42" y="828" font-family="monospace" font-size="11" fill="#7a8fa6" letter-spacing="1.2">WHAT THIS CARD CANNOT TELL YOU</text>
<text x="42" y="850" font-family="Georgia,serif" font-size="14" fill="#b9cbdd" opacity="0.95">Who this is. The toolkit was found before it was used, which is</text>
<text x="42" y="869" font-family="Georgia,serif" font-size="14" fill="#b9cbdd" opacity="0.95">unusual and good, but it means attribution rests on capability</text>
<text x="42" y="888" font-family="Georgia,serif" font-size="14" fill="#b9cbdd" opacity="0.95">analysis rather than on observed operations against a victim.</text>
<text x="42" y="907" font-family="Georgia,serif" font-size="14" fill="#b9cbdd" opacity="0.95">This is the only card in my set where the tooling is better</text>
<text x="42" y="926" font-family="Georgia,serif" font-size="14" fill="#b9cbdd" opacity="0.95">documented than the operator, and putting a confident name on</text>
<text x="42" y="945" font-family="Georgia,serif" font-size="14" fill="#b9cbdd" opacity="0.95">the card would misrepresent that.</text>

<line x1="42" y1="958" x2="708" y2="958" stroke="#ff6b5e" stroke-width="0.8" opacity="0.3"/>
<text x="42" y="980" font-family="monospace" font-size="10.5" fill="#7a8fa6">CONFIDENCE: DOCUMENTED</text>
<text x="42" y="998" font-family="monospace" font-size="9.5" fill="#5f7a90">PROVENANCE: CISA advisory AA22-103A, April 2022, issued jointly with DOE, NSA and FBI; Dragos</text>
<text x="42" y="1013" font-family="monospace" font-size="9.5" fill="#5f7a90">PIPEDREAM reporting.</text>
<text x="708" y="1010" text-anchor="end" font-family="monospace" font-size="9.5" fill="#4a6070">CS 581 · W2 · J. REYES</text>

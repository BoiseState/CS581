<text x="42" y="828" font-family="monospace" font-size="11" fill="#7a8fa6" letter-spacing="1.2">WHAT THIS CARD CANNOT TELL YOU</text>
<text x="42" y="850" font-family="Georgia,serif" font-size="14" fill="#b9cbdd" opacity="0.95">Which tier this actor really belongs in. It brands itself</text>
<text x="42" y="869" font-family="Georgia,serif" font-size="14" fill="#b9cbdd" opacity="0.95">hacktivist and the bar was low: exposed PLCs with default</text>
<text x="42" y="888" font-family="Georgia,serif" font-size="14" fill="#b9cbdd" opacity="0.95">passwords. But CISA attributes the campaign to IRGC-affiliated</text>
<text x="42" y="907" font-family="Georgia,serif" font-size="14" fill="#b9cbdd" opacity="0.95">actors. A capability tier is one field and this actor needs a</text>
<text x="42" y="926" font-family="Georgia,serif" font-size="14" fill="#b9cbdd" opacity="0.95">paragraph.</text>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1050" width="750" height="1050" role="img" aria-label="Threat actor card: DarkSide">
<defs>
  <linearGradient id="g04" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#140d1a"/><stop offset="1" stop-color="#07090c"/>
  </linearGradient>
  <clipPath id="art04"><rect x="42" y="150" width="666" height="380" rx="6"/></clipPath>
</defs>
<rect width="750" height="1050" rx="22" fill="url(#g04)"/>
<rect x="14" y="14" width="722" height="1022" rx="14" fill="none" stroke="#9b6bd6" stroke-width="2.5" opacity="0.75"/>
<rect x="26" y="26" width="698" height="998" rx="9" fill="none" stroke="#c79bf0" stroke-width="0.8" opacity="0.3"/>

<text x="42" y="74" font-family="Georgia,serif" font-size="40" font-weight="bold" fill="#f2f6fa">DarkSide</text>
<text x="42" y="104" font-family="monospace" font-size="14" fill="#c79bf0" opacity="0.9">the Colonial Pipeline ransomware affiliate operation</text>
<rect x="42" y="118" width="87.2" height="24" rx="12" fill="#9b6bd6" opacity="0.22"/>
<text x="54" y="135" font-family="monospace" font-size="12.5" font-weight="bold" fill="#c79bf0" letter-spacing="1.4">CRIMINAL</text>
<text x="708" y="74" text-anchor="end" font-family="monospace" font-size="34" fill="#9b6bd6" opacity="0.5">#04</text>

<rect x="42" y="150" width="666" height="380" rx="6" fill="#05070a" stroke="#c79bf0" stroke-width="0.8" opacity="0.95"/>
<g clip-path="url(#art04)"><g transform="translate(375 340) scale(1.55)"><g transform="rotate(0.0 0 0)"><path d="M -11.080149145098403 -65.7341957851313 L 0 -117.20910512749106 L 11.080149145098403 -65.7341957851313 Z" fill="#c79bf0" opacity="0.36"/></g><g transform="rotate(40.0 0 0)"><path d="M -6.399934788933024 -68.05067274160683 L 0 -113.46037326008081 L 6.399934788933024 -68.05067274160683 Z" fill="#c79bf0" opacity="0.68"/></g><g transform="rotate(80.0 0 0)"><path d="M -8.509579366073012 -51.43842087499797 L 0 -97.27851881459355 L 8.509579366073012 -51.43842087499797 Z" fill="#c79bf0" opacity="0.56"/></g><g transform="rotate(120.0 0 0)"><path d="M -6.556061837123707 -46.31660846201703 L 0 -109.88057339005172 L 6.556061837123707 -46.31660846201703 Z" fill="#c79bf0" opacity="0.58"/></g><g transform="rotate(160.0 0 0)"><path d="M -5.2850152174942195 -67.20541386771947 L 0 -114.01645163539797 L 5.2850152174942195 -67.20541386771947 Z" fill="#c79bf0" opacity="0.53"/></g><g transform="rotate(200.0 0 0)"><path d="M -5.094745045294985 -50.82379549415782 L 0 -99.16920495405793 L 5.094745045294985 -50.82379549415782 Z" fill="#c79bf0" opacity="0.60"/></g><g transform="rotate(240.0 0 0)"><path d="M -10.306297083385289 -75.92021527606994 L 0 -99.69754707533866 L 10.306297083385289 -75.92021527606994 Z" fill="#c79bf0" opacity="0.54"/></g><g transform="rotate(280.0 0 0)"><path d="M -16.738510254072025 -59.331003305502236 L 0 -108.61176325567067 L 16.738510254072025 -59.331003305502236 Z" fill="#c79bf0" opacity="0.55"/></g><g transform="rotate(320.0 0 0)"><path d="M -6.1486011813394725 -60.398253329563886 L 0 -88.13700899202377 L 6.1486011813394725 -60.398253329563886 Z" fill="#c79bf0" opacity="0.45"/></g><circle r="26" fill="none" stroke="#c79bf0" stroke-width="1.2" opacity="0.5"/><circle r="43" fill="none" stroke="#c79bf0" stroke-width="1.4" opacity="0.5"/><circle r="9" fill="#c79bf0" opacity="0.85"/></g></g>
<text x="56" y="518" font-family="monospace" font-size="10" fill="#c79bf0" opacity="0.45">SIGIL: PROCEDURAL · NOT A LIKENESS · NO PERSON DEPICTED</text>

<line x1="42" y1="558" x2="708" y2="558" stroke="#c79bf0" stroke-width="1" opacity="0.4"/>
<text x="42" y="590" font-family="monospace" font-size="11" fill="#7a8fa6" letter-spacing="1.2">SIGNATURE TTP</text>
<text x="42" y="616" font-family="Georgia,serif" font-size="19" fill="#f2f6fa">Data Encrypted for Impact against IT systems, with</text>
<text x="42" y="640" font-family="Georgia,serif" font-size="19" fill="#f2f6fa">OT consequences arising indirectly</text>
<rect x="42" y="654" width="153" height="26" rx="4" fill="#9b6bd6" opacity="0.2"/>
<text x="53" y="672" font-family="monospace" font-size="13" font-weight="bold" fill="#c79bf0">T1486</text>
<text x="107" y="672" font-family="monospace" font-size="10" fill="#7a8fa6">ENTERPRISE</text>
<text x="42" y="698" font-family="monospace" font-size="10" fill="#7a8fa6" opacity="0.9">No ICS technique applies: the encryption hit IT systems only. The OT consequence</text>
<text x="42" y="713" font-family="monospace" font-size="10" fill="#7a8fa6" opacity="0.9">followed from an operator containment decision, not from a control-system effect.</text>

<text x="42" y="740" font-family="monospace" font-size="11" fill="#7a8fa6" letter-spacing="1.2">SECTOR TARGETING</text>
<text x="42" y="762" font-family="Georgia,serif" font-size="15" fill="#dce8f4">Opportunistic across sectors · Selected by</text>
<text x="42" y="783" font-family="Georgia,serif" font-size="15" fill="#dce8f4">ability to pay, not by sector</text>
<text x="430" y="740" font-family="monospace" font-size="11" fill="#7a8fa6" letter-spacing="1.2">FIRST OBSERVED</text>
<text x="430" y="762" font-family="Georgia,serif" font-size="15" fill="#dce8f4">2020; Colonial Pipeline 2021</text>

<line x1="42" y1="800" x2="708" y2="800" stroke="#c79bf0" stroke-width="1" opacity="0.4"/>
<text x="42" y="828" font-family="monospace" font-size="11" fill="#7a8fa6" letter-spacing="1.2">WHAT THIS CARD CANNOT TELL YOU</text>
<text x="42" y="850" font-family="Georgia,serif" font-size="14" fill="#b9cbdd" opacity="0.95">That this was an OT attack. It was not. DarkSide encrypted IT</text>
<text x="42" y="869" font-family="Georgia,serif" font-size="14" fill="#b9cbdd" opacity="0.95">systems; Colonial halted the pipeline to contain the incident</text>
<text x="42" y="888" font-family="Georgia,serif" font-size="14" fill="#b9cbdd" opacity="0.95">while assessing how far the compromise reached. CISA and FBI</text>
<text x="42" y="907" font-family="Georgia,serif" font-size="14" fill="#b9cbdd" opacity="0.95">reported no indication the ransomware directly affected OT,</text>
<text x="42" y="926" font-family="Georgia,serif" font-size="14" fill="#b9cbdd" opacity="0.95">which is a finding at the time, not a guarantee.</text>

<line x1="42" y1="958" x2="708" y2="958" stroke="#c79bf0" stroke-width="0.8" opacity="0.3"/>
<text x="42" y="980" font-family="monospace" font-size="10.5" fill="#7a8fa6">CONFIDENCE: DOCUMENTED</text>
<text x="42" y="998" font-family="monospace" font-size="9.5" fill="#5f7a90">PROVENANCE: CISA and FBI joint advisory AA21-131A, May 2021; Colonial Pipeline public statements</text>
<text x="42" y="1013" font-family="monospace" font-size="9.5" fill="#5f7a90">and subsequent congressional testimony.</text>
<text x="708" y="1010" text-anchor="end" font-family="monospace" font-size="9.5" fill="#4a6070">CS 581 · W2 · J. REYES</text>
</svg>
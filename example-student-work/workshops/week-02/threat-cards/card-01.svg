<text x="53" y="672" font-family="monospace" font-size="13" font-weight="bold" fill="#ff6b5e">T0889</text>

<text x="42" y="718" font-family="monospace" font-size="11" fill="#7a8fa6" letter-spacing="1.2">SECTOR TARGETING</text>
<text x="42" y="740" font-family="Georgia,serif" font-size="15" fill="#dce8f4">Oil and gas · Petrochemical · Electric</text>
<text x="42" y="761" font-family="Georgia,serif" font-size="15" fill="#dce8f4">utilities (reconnaissance reported)</text>
<text x="430" y="718" font-family="monospace" font-size="11" fill="#7a8fa6" letter-spacing="1.2">FIRST OBSERVED</text>
<text x="430" y="740" font-family="Georgia,serif" font-size="15" fill="#dce8f4">2017, via the TRITON incident</text>

<line x1="42" y1="800" x2="708" y2="800" stroke="#ff6b5e" stroke-width="1" opacity="0.4"/>
<text x="42" y="828" font-family="monospace" font-size="11" fill="#7a8fa6" letter-spacing="1.2">WHAT THIS CARD CANNOT TELL YOU</text>
<text x="42" y="850" font-family="Georgia,serif" font-size="14" fill="#b9cbdd" opacity="0.95">That the TRITON intrusion succeeded. It did not. The safety</text>
<text x="42" y="869" font-family="Georgia,serif" font-size="14" fill="#b9cbdd" opacity="0.95">system tripped the plant because the attacker's code was wrong,</text>
<text x="42" y="888" font-family="Georgia,serif" font-size="14" fill="#b9cbdd" opacity="0.95">which is how anyone found out. The most famous safety-system</text>
<text x="42" y="907" font-family="Georgia,serif" font-size="14" fill="#b9cbdd" opacity="0.95">attack on record is also a story about an attacker failing.</text>

<line x1="42" y1="958" x2="708" y2="958" stroke="#ff6b5e" stroke-width="0.8" opacity="0.3"/>
<text x="42" y="980" font-family="monospace" font-size="10.5" fill="#7a8fa6">CONFIDENCE: DOCUMENTED</text>
<text x="42" y="998" font-family="monospace" font-size="9.5" fill="#5f7a90">PROVENANCE: US Treasury sanctions action of October 2018 naming a Russian government research</text>
<text x="42" y="1013" font-family="monospace" font-size="9.5" fill="#5f7a90">institute (TsNIIKhM); Dragos activity group reporting; MITRE ATT&amp;CK for ICS.</text>
<text x="708" y="1010" text-anchor="end" font-family="monospace" font-size="9.5" fill="#4a6070">CS 581 · W2 · J. REYES</text>
